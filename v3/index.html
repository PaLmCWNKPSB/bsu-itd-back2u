<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Back 2 U — พรีเซนต์โครงงาน</title>
<link rel="icon" href="img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--navy:#061538;--navy2:#0c2a63;--teal:#22b8cf;--cyan:#6fe7f7;--mint:#34d399;--rose:#fb7185;--ink:#eaf6ff;--muted:#9fb6d6;
--fd:"Anuphan","Leelawadee UI","Tahoma",sans-serif;--fb:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;--fm:"IBM Plex Mono","Consolas",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:var(--fb)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--navy)}
.abs{position:absolute}
/* ── สตูดิโอ ── */
#bg{position:absolute;inset:-120px;transform-origin:50% 50%}
#bg .wall{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 38%,#123b86 0%,#0a2257 38%,#061538 70%,#030b20 100%)}
#bg .grid{position:absolute;inset:0;opacity:.55;background-image:linear-gradient(rgba(111,231,247,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(111,231,247,.07) 1px,transparent 1px);background-size:64px 64px}
#bg .circuit{position:absolute;inset:0;opacity:.5}
#bg .pillar{position:absolute;top:0;bottom:30%;width:150px;background:linear-gradient(90deg,transparent,rgba(34,184,207,.16),transparent)}
#bg .backscreen{position:absolute;left:50%;top:150px;width:1100px;height:520px;margin-left:-550px;border:2px solid rgba(111,231,247,.25);border-radius:22px;background:linear-gradient(180deg,rgba(34,184,207,.08),rgba(12,42,99,.2));overflow:hidden}
#bg .backscreen img{position:absolute;left:50%;top:50%;width:300px;margin:-150px 0 0 -150px;opacity:.12}
#bg .bars{position:absolute;left:40px;right:40px;bottom:30px;height:120px;display:flex;align-items:flex-end;gap:10px;opacity:.35}
#bg .bars i{flex:1;background:linear-gradient(0deg,var(--teal),rgba(111,231,247,.2));border-radius:3px 3px 0 0}
#bg .floor{position:absolute;left:-30%;right:-30%;bottom:-40%;height:85%;transform:perspective(900px) rotateX(74deg);transform-origin:50% 0;
background-image:linear-gradient(rgba(111,231,247,.28) 2px,transparent 2px),linear-gradient(90deg,rgba(111,231,247,.28) 2px,transparent 2px);background-size:110px 110px;
-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%);mask-image:linear-gradient(180deg,transparent 0%,#000 30%)}
#bg .horizon{position:absolute;left:0;right:0;top:61%;height:3px;background:linear-gradient(90deg,transparent,rgba(111,231,247,.7),transparent)}
#bg .sweep{position:absolute;top:0;bottom:0;width:340px;background:linear-gradient(90deg,transparent,rgba(111,231,247,.07),transparent)}
.pt{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--cyan)}
.bin{position:absolute;font:600 18px var(--fm);color:rgba(111,231,247,.18);line-height:1.15;white-space:pre}
/* ── ผู้นำเสนอ (โลกที่กล้องจับ) ── */
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#pres{position:absolute;height:900px;transform-origin:50% 100%}
#pres img{height:100%;display:block}
#shadow{position:absolute;width:420px;height:70px;border-radius:50%;background:radial-gradient(closest-side,rgba(34,184,207,.55),rgba(34,184,207,.15) 60%,transparent)}
#ring{position:absolute;width:520px;height:110px;border-radius:50%;border:3px solid rgba(111,231,247,.5)}
/* โทรศัพท์ลอยข้างมือ */
.phone{position:absolute;width:132px;height:282px;border-radius:20px;background:#0b1220;border:3px solid #9fe9f5;padding:7px;transform-origin:50% 100%}
.phone .scr{position:relative;width:100%;height:100%;border-radius:13px;overflow:hidden;background:#fff}
.phone img{position:absolute;left:0;top:0;width:100%}
.phone .notch{position:absolute;left:50%;top:7px;width:40px;height:9px;margin-left:-20px;border-radius:0 0 8px 8px;background:#0b1220;z-index:2}
.phone .base{position:absolute;left:-40px;right:-40px;bottom:-34px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(111,231,247,.7),transparent)}
.phone .beam{position:absolute;left:-20px;right:-20px;bottom:-24px;height:120px;background:linear-gradient(0deg,rgba(111,231,247,.28),transparent);clip-path:polygon(30% 100%,70% 100%,100% 0,0 0);transform:translateY(-100%) scaleY(-1);opacity:.6}
/* ── กราฟิกบนจอ ── */
#hud{position:absolute;inset:0;perspective:1700px;pointer-events:none}
.panel{position:absolute;top:150px;width:820px;padding:30px 34px 32px;border-radius:22px;background:linear-gradient(160deg,rgba(15,52,112,.86),rgba(6,21,56,.9));
border:2px solid rgba(111,231,247,.55);box-shadow:0 0 0 1px rgba(111,231,247,.15) inset,0 0 40px rgba(34,184,207,.25),0 30px 60px rgba(0,0,0,.45);transform-origin:50% 100%;opacity:0}
.panel::before{content:"";position:absolute;inset:0;border-radius:20px;background:repeating-linear-gradient(0deg,rgba(111,231,247,.05) 0 2px,transparent 2px 5px);pointer-events:none}
.panel .cn{position:absolute;width:26px;height:26px;border-color:var(--cyan);border-style:solid}
.panel .c1{left:-2px;top:-2px;border-width:4px 0 0 4px;border-radius:12px 0 0 0}.panel .c2{right:-2px;top:-2px;border-width:4px 4px 0 0;border-radius:0 12px 0 0}
.panel .c3{left:-2px;bottom:-2px;border-width:0 0 4px 4px;border-radius:0 0 0 12px}.panel .c4{right:-2px;bottom:-2px;border-width:0 4px 4px 0;border-radius:0 0 12px 0}
.panel .tag{display:inline-flex;align-items:center;gap:10px;font:600 22px var(--fm);color:var(--navy);background:var(--cyan);padding:3px 14px;border-radius:8px;letter-spacing:.04em}
.panel h2{font:700 46px/1.25 var(--fd);margin:14px 0 4px;color:#fff}
.panel h3{font:600 30px/1.3 var(--fd);color:var(--cyan);margin-bottom:16px}
.beamP{position:absolute;bottom:-150px;left:15%;right:15%;height:150px;background:linear-gradient(0deg,rgba(111,231,247,.0),rgba(111,231,247,.22));clip-path:polygon(0 0,100% 0,62% 100%,38% 100%)}
.it{opacity:0}
.panel.sm .bl{font-size:24px;margin-top:12px}.panel.sm h2{font-size:40px}
.panel.cmp .bl{font-size:25px;margin-top:10px}.panel.cmp h2{font-size:42px;margin-top:10px}.panel.cmp .photos img{width:132px;height:88px}.panel.cmp .chips3{margin-top:12px}.panel.cmp .ch{padding:8px;font-size:21px}.panel.cmp .res{margin-top:12px;padding:10px 16px;font-size:24px}
.bl{display:flex;gap:16px;align-items:flex-start;font:500 29px/1.45 var(--fb);color:#eef7ff;margin-top:14px}
.bl b.n{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(111,231,247,.16);border:2px solid rgba(111,231,247,.6);color:var(--cyan);font:700 24px/40px var(--fm);text-align:center}
.cards{display:grid;gap:14px;margin-top:6px}
.card{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:rgba(111,231,247,.08);border:1.5px solid rgba(111,231,247,.3);font:500 27px/1.45 var(--fb)}
.card .k{flex:none;font:700 30px var(--fm);color:var(--cyan)}
.res{margin-top:18px;padding:14px 18px;border-radius:14px;background:rgba(251,113,133,.14);border:2px solid rgba(251,113,133,.6);font:600 27px/1.45 var(--fb)}
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.ch{padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);text-align:center;font:600 23px/1.3 var(--fb);position:relative}
.ch small{display:block;font:400 19px var(--fb);color:var(--muted);margin-top:4px}
.ch .x{position:absolute;right:-10px;top:-12px;width:34px;height:34px;border-radius:50%;background:var(--rose);color:#fff;font:700 22px/34px var(--fb)}
.photos{display:flex;gap:14px;margin-top:16px}.photos img{width:150px;height:110px;object-fit:cover;border-radius:12px;border:2px solid rgba(111,231,247,.4)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col h4{font:700 30px var(--fd);margin-bottom:6px}.col h4.u{color:var(--cyan)}.col h4.a{color:#fcd34d}
.col li{list-style:none;font:500 23px/1.4 var(--fb);margin-top:8px;padding-left:24px;position:relative}
.col li::before{content:"";position:absolute;left:4px;top:13px;width:9px;height:9px;border-radius:2px;background:currentColor;opacity:.7}
.tools{display:grid;grid-template-columns:1fr;gap:12px}
.tool{padding:12px 14px;border-radius:14px;background:rgba(111,231,247,.06);border:1px solid rgba(111,231,247,.22)}
.tool h4{font:700 25px/1.3 var(--fd);color:var(--cyan);margin-bottom:8px}
.tool span{display:inline-block;font:600 19px var(--fm);padding:5px 10px;margin:0 6px 7px 0;border-radius:8px;background:rgba(111,231,247,.12);border:1px solid rgba(111,231,247,.35)}
table.g{width:100%;border-collapse:collapse;font:500 19px var(--fb)}
table.g th,table.g td{border:1px solid rgba(111,231,247,.28);padding:6px 6px;text-align:center}
table.g th{font:600 18px var(--fb);color:var(--cyan);background:rgba(111,231,247,.08)}
table.g td.l{text-align:left;white-space:nowrap}
table.g td.on{background:rgba(52,211,153,.55)}table.g td.ok{color:var(--mint);font-weight:700}
.refs li{list-style:none;display:flex;justify-content:space-between;gap:16px;font:500 24px/1.35 var(--fb);padding:10px 0;border-bottom:1px solid rgba(111,231,247,.18)}
.refs li span{font:500 19px var(--fm);color:var(--cyan);white-space:nowrap}
.team li{list-style:none;display:flex;align-items:center;gap:16px;font:600 26px/1.25 var(--fb);padding:8px 0;border-bottom:1px solid rgba(111,231,247,.16)}
.team li i{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#3b82f6);font:700 22px/46px var(--fd);font-style:normal;text-align:center}
.team li small{display:block;font:500 19px var(--fm);color:var(--cyan);margin-top:2px}
.adv{margin-top:16px;padding:12px 16px;border-radius:14px;background:rgba(252,211,77,.12);border:1.5px solid rgba(252,211,77,.5);font:600 26px var(--fb)}
.adv small{display:block;font:500 19px var(--fb);color:#fcd34d}
.toc li{list-style:none;display:flex;gap:18px;align-items:center;font:500 28px/1.3 var(--fb);padding:9px 0}
.toc li b{flex:none;width:76px;font:700 26px var(--fm);color:var(--cyan)}
.step{font:600 24px var(--fm);color:var(--cyan)}
.big{font:700 64px/1.2 var(--fd);color:#fff}
.url{font:600 34px var(--fm);color:var(--cyan);margin-top:10px}
.qrbox{display:flex;gap:28px;align-items:center}
.qrbox img{width:300px;height:auto;border-radius:18px;background:#fff;padding:12px}
.dev{position:relative}
.laptop{width:560px;border-radius:14px 14px 0 0;border:10px solid #0b1220;border-bottom-width:14px;background:#0b1220}
.laptop img{width:100%;display:block;border-radius:4px}
.lapbase{width:640px;height:18px;margin-left:-40px;border-radius:0 0 18px 18px;background:linear-gradient(#9fb6d6,#5b6f8f)}
.mphone{position:absolute;right:-10px;bottom:-30px;width:170px;border-radius:20px;border:6px solid #0b1220;overflow:hidden;background:#fff}
.mphone img{width:100%;display:block}
/* ป้ายชื่อ (lower third) */
#lower{position:absolute;left:90px;bottom:300px;display:flex;align-items:stretch;opacity:0}
#lower .bar{width:12px;background:var(--cyan);border-radius:6px 0 0 6px}
#lower .box{background:linear-gradient(90deg,rgba(6,21,56,.95),rgba(12,42,99,.92));padding:14px 30px 16px 22px;border-radius:0 14px 14px 0;border:2px solid rgba(111,231,247,.4);border-left:0}
#lower .nm{font:700 44px/1.2 var(--fd)}#lower .rl{font:500 24px var(--fb);color:var(--cyan)}
/* แถบบน */
#bug{position:absolute;left:40px;top:34px;display:flex;align-items:center;gap:14px;opacity:0}
#bug img{width:62px;height:62px;border-radius:16px;background:#fff;padding:5px}
#bug .t1{font:700 30px var(--fd);letter-spacing:.02em}#bug .t2{font:500 20px var(--fb);color:var(--cyan)}
#sec{position:absolute;right:44px;top:40px;display:flex;align-items:center;gap:12px;opacity:0;font:600 22px var(--fm)}
#sec .dots{display:flex;gap:7px}#sec .dots i{width:16px;height:6px;border-radius:3px;background:rgba(111,231,247,.25)}#sec .dots i.on{background:var(--cyan)}
#sec .lab{padding:6px 14px;border-radius:10px;border:1.5px solid rgba(111,231,247,.5);background:rgba(6,21,56,.7);font:600 22px var(--fb)}
/* แถบข่าวล่าง + ซับ */
#ticker{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;background:rgba(3,11,32,.92);border-top:2px solid rgba(111,231,247,.5);opacity:0}
#ticker .tg{flex:none;padding:0 22px;display:flex;align-items:center;background:var(--teal);color:var(--navy);font:700 24px var(--fd)}
#ticker .run{position:relative;flex:1;overflow:hidden}
#ticker .tx{position:absolute;top:0;white-space:nowrap;font:500 24px/52px var(--fb);color:#d6ecff}
#sub{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);width:max-content;max-width:1560px;text-align:center;font:600 38px/1.38 var(--fb);color:#fff;
background:rgba(2,8,24,.78);border:1.5px solid rgba(111,231,247,.3);padding:10px 30px 12px;border-radius:16px;opacity:0;text-wrap:balance}
/* เปิดตัว / ปิดท้าย */
.ov{position:absolute;inset:0;opacity:0;background:radial-gradient(80% 80% at 50% 50%,#0d2b66 0%,#061538 55%,#020818 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ov .gl{position:absolute;background:rgba(111,231,247,.5)}
.ov .rings{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px}
.ov .logo{width:250px;height:250px;border-radius:56px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 70px rgba(111,231,247,.45);position:relative}
.ov .logo img{width:210px}
.ov .bt{font:700 104px/1 var(--fd);margin-top:34px;letter-spacing:.02em}
.ov .bt span{color:var(--cyan)}
.ov .th{font:600 40px var(--fd);margin-top:16px}
.ov .en{font:500 26px var(--fm);color:var(--cyan);margin-top:8px;letter-spacing:.06em}
.ov .un{font:500 24px var(--fb);color:var(--muted);margin-top:22px;text-align:center;line-height:1.5}
.ov .kick{position:absolute;top:70px;font:600 24px var(--fm);color:var(--cyan);letter-spacing:.18em}
#outro .row{display:flex;gap:56px;align-items:center}
#outro .qr{width:250px;border-radius:18px;background:#fff;padding:10px}
#outro .ty{font:700 88px var(--fd)}
#outro .names{margin-top:26px;font:500 23px/1.55 var(--fb);color:#cfe3ff;text-align:center}
#warp{position:absolute;inset:0;pointer-events:none}
#flash{position:absolute;inset:0;background:#e9fdff;opacity:0;pointer-events:none}
#glitch{position:absolute;left:0;right:0;height:90px;background:rgba(111,231,247,.35);mix-blend-mode:screen;opacity:0}
/* ตัวควบคุม (ไม่แสดงในโหมดเรนเดอร์) */
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 16px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);opacity:0;transition:opacity .3s;z-index:10}
body:hover #ui,#ui.show{opacity:1}
#ui button,#ui a{font:600 15px var(--fb);color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 14px;cursor:pointer;text-decoration:none}
#ui button:focus-visible,#ui a:focus-visible,#start:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#bar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.2);cursor:pointer;position:relative}
#bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--cyan)}
#time{font:500 14px var(--fm);color:#dbeafe;min-width:96px;text-align:right}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(2,8,24,.72);z-index:20;cursor:pointer;border:0;color:#fff;font-family:var(--fb)}
#start b{width:120px;height:120px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px rgba(34,184,207,.6)}
#start b::after{content:"";margin-left:10px;border-left:40px solid #fff;border-top:26px solid transparent;border-bottom:26px solid transparent}
#start span{font:600 26px var(--fd)}#start small{font:400 17px var(--fb);color:#b9d3ef}
body.render #ui,body.render #start{display:none!important}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bg">
    <div class="wall"></div><div class="grid"></div>
    <svg class="circuit" width="100%" height="100%" viewBox="0 0 2160 1320" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="rgba(111,231,247,.18)" stroke-width="2">
        <path d="M0 180 H260 L320 240 H520"/><path d="M0 420 H180 L240 360 H420 L470 410"/><path d="M2160 220 H1880 L1820 280 H1640"/><path d="M2160 470 H1960 L1900 410 H1720 L1680 450"/>
        <path d="M140 0 V120 L200 180"/><path d="M2020 0 V140 L1960 200"/><path d="M0 640 H120 L170 690 H300"/><path d="M2160 680 H2030 L1980 730 H1860"/>
      </g>
      <g fill="rgba(111,231,247,.4)"><circle cx="520" cy="240" r="6"/><circle cx="470" cy="410" r="6"/><circle cx="1640" cy="280" r="6"/><circle cx="1680" cy="450" r="6"/><circle cx="300" cy="690" r="6"/><circle cx="1860" cy="730" r="6"/></g>
    </svg>
    <div class="pillar" style="left:14%"></div><div class="pillar" style="left:31%"></div><div class="pillar" style="right:31%"></div><div class="pillar" style="right:14%"></div>
    <div class="backscreen"><img src="img/logo.webp" alt=""><div class="bars" id="bars"></div></div>
    <div class="floor"></div><div class="horizon"></div><div class="sweep" id="sweep"></div>
    <div id="pts"></div>
  </div>
  <div id="world">
    <div id="ring" class="abs"></div><div id="shadow" class="abs"></div>
    <div id="pres"><img src="img/presenter.webp" alt="ชวนากร พวงสมบัติ"></div>
    <div id="phones"></div>
  </div>
  <div id="hud">
    <div id="panels"></div>
    <div id="lower"><div class="bar"></div><div class="box"><div class="nm">ชวนากร พวงสมบัติ</div><div class="rl">ตัวแทนกลุ่มผู้จัดทำ · สาขาเทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล</div></div></div>
    <div id="bug"><img src="img/logo.webp" alt=""><div><div class="t1">BACK 2 U</div><div class="t2" id="bugsec">พรีเซนต์โครงงาน</div></div></div>
    <div id="sec"><div class="dots" id="dots"></div><div class="lab" id="seclab"></div></div>
    <div id="sub"></div>
    <div id="ticker"><div class="tg">BACK 2 U</div><div class="run"><div class="tx" id="tx"></div></div></div>
  </div>
  <div id="intro" class="ov">
    <div class="kick" id="kick"></div>
    <div class="gl" id="gl1" style="left:0;right:0;top:50%;height:2px"></div><div class="gl" id="gl2" style="top:0;bottom:0;left:50%;width:2px"></div>
    <svg class="rings" id="rings" viewBox="0 0 520 520" aria-hidden="true"><g fill="none" stroke="rgba(111,231,247,.55)"><circle cx="260" cy="260" r="250" stroke-width="2" stroke-dasharray="14 10"/><circle cx="260" cy="260" r="205" stroke-width="4" stroke-dasharray="120 40 30 40"/><circle cx="260" cy="260" r="170" stroke-width="1.5"/></g></svg>
    <div class="logo" id="ilogo"><img src="img/logo.webp" alt="Back 2 U"></div>
    <div class="bt" id="ibt">Back <span>2</span> U</div>
    <div class="th" id="ith"></div>
    <div class="en" id="ien"></div>
    <div class="un" id="iun"></div>
  </div>
