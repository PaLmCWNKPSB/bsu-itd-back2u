       เนื้อหาสำคัญอยู่เหนือ y≈860 เพราะซับ 2 บรรทัดใช้พื้นที่ด้านล่าง · ทุกการเคลื่อนไหวคุมด้วย GSAP บน timeline เดียว
   ============================================================================ */
:root{
  --navy:#0F2A6B; --navy2:#0B1F52; --teal:#22B8CF; --teal2:#1597AD; --mint:#34D399; --mint2:#10B981;
  --sky:#EAF6FB; --sky2:#DCEFFB; --ink:#16264D; --text:#33466E; --mute:#6B7C9C; --line:#D5E7F2;
  --rose:#E11D48; --rose1:#FFE4E6; --amber:#B45309; --amber1:#FEF3C7; --green:#047857; --green1:#D1FAE5;
  --card:#FFFFFF;
  --shadow:0 24px 60px rgba(15,42,107,.10),0 2px 8px rgba(15,42,107,.06);
  --font:'Kanit','Leelawadee UI',Tahoma,sans-serif;
  --mono:'JetBrains Mono','Cascadia Mono',Consolas,ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:#DCEBF4;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:var(--font)}
#app{position:fixed;inset:0;background:#DCEBF4}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(.4);transform-origin:center center;overflow:hidden;
  background:radial-gradient(120% 95% at 50% 38%,#FFFFFF 0%,#F5FBFE 52%,#E2F1F8 100%)}
#stage *{box-sizing:border-box}
.scene{position:absolute;inset:0;visibility:hidden;opacity:0}
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:1}
#vig{position:absolute;inset:0;pointer-events:none;z-index:39;background:radial-gradient(130% 100% at 50% 50%,rgba(15,42,107,0) 60%,rgba(15,42,107,.08) 100%)}
/* แสงพื้นหลังนุ่ม ๆ — radial-gradient ล้วน ไม่ใช้ filter:blur (ภาพเหมือนกันแต่ไม่กินเครื่อง) */
.glow{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.g1{width:1100px;height:1100px;left:-320px;top:-380px;background:radial-gradient(circle,rgba(34,184,207,.20),rgba(34,184,207,0) 66%)}
.g2{width:1200px;height:1200px;right:-420px;bottom:-560px;background:radial-gradient(circle,rgba(52,211,153,.20),rgba(52,211,153,0) 66%)}
.g3{width:900px;height:900px;left:560px;top:120px;background:radial-gradient(circle,rgba(220,239,251,.75),rgba(220,239,251,0) 68%)}

/* โลโก้ + แสงวิ่งพาดผ่าน (ชั้นแสงใช้ mask เป็นรูปโลโก้ จึงวิ่งเฉพาะบนตัวโลโก้ สีโลโก้จริงคงเดิม) */
.logo{position:absolute;background:var(--logo) center/contain no-repeat}
.logo .shine{position:absolute;inset:0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
  background:linear-gradient(110deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 42%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 58%,rgba(255,255,255,0) 100%);
  background-size:300% 100%;background-position:100% 0}
.gtxt{background:linear-gradient(100deg,#1597AD 0%,#22B8CF 40%,#34D399 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{font:500 26px/1 var(--font);color:var(--teal2);margin:0;display:flex;align-items:center;gap:14px}
.kicker::before{content:"";width:56px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--mint))}
.h2{margin:14px 0 0;font:700 66px/1.12 var(--font);color:var(--navy);letter-spacing:-.01em}
.w{display:inline-block;will-change:transform}
.glass{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tagx{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font:600 15px/1.2 var(--font);white-space:nowrap}
.sample{position:absolute;z-index:8;padding:6px 14px;border-radius:999px;background:#FFF7E6;border:1px solid #F6D58E;color:#9A6200;font:600 16px/1 var(--font)}

/* ป้ายบท + มุมจอ */
#chip{position:absolute;left:60px;top:44px;z-index:30;display:flex;align-items:center;gap:16px;height:60px}
#chip .logo{position:relative;width:60px;height:60px}
#chip .c{position:absolute;left:76px;white-space:nowrap;font:600 24px/1 var(--font);color:var(--navy);opacity:0}
/* แถบกวาดเปลี่ยนบท (wipe) — สี่เหลี่ยมเอียงสองชั้นวิ่งผ่านจอ ใช้ transform ล้วน */
#wipe{position:absolute;inset:0;z-index:32;pointer-events:none;overflow:hidden}
#wipe i{position:absolute;left:0;top:-300px;width:1500px;height:1680px;transform:translateX(-2400px) skewX(-14deg)}
#wipe .w1{background:linear-gradient(90deg,#22B8CF,#34D399)}
#wipe .w2{background:linear-gradient(90deg,#0F2A6B,#1C3F8F)}

/* ซับไตเติล: กล่องน้ำเงินเข้มโปร่ง อ่านได้บนทุกพื้น · ไม่เกิน 2 บรรทัด · อยู่ใต้ y≈860 เสมอ */
#subs{position:absolute;left:0;right:0;bottom:40px;z-index:35;display:grid;place-items:center;pointer-events:none}
#subs.off{display:none}
.sub{grid-area:1/1;text-align:center;max-width:1600px;padding:14px 38px 16px;border-radius:20px;background:rgba(11,31,82,.88);opacity:0;visibility:hidden;box-shadow:0 12px 34px rgba(11,31,82,.22)}
.sub .m{font:500 38px/1.38 var(--font);color:#FFFFFF;text-wrap:balance}
.sub .a{font:400 23px/1.4 var(--font);color:#9EE7F2;margin-top:4px;text-wrap:balance}
/* ซับยาวเกินแถบปลอดภัย → ย่อตัวอักษรอัตโนมัติ (ตั้งคลาสตอนสร้าง timeline) */
.sub.long .m{font-size:32px}
.sub.long .a{font-size:20px}

/* ── INTRO ── */
#introLogo{left:745px;top:90px;width:430px;height:430px}
.intro-line{position:absolute;left:510px;top:560px;width:900px;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(34,184,207,0),#22B8CF,#34D399,rgba(52,211,153,0));transform:scaleX(0)}
.intro-tag{position:absolute;left:0;right:0;top:598px;margin:0;text-align:center;font:500 26px/1 var(--font);letter-spacing:.34em;color:var(--teal2)}
.intro-sub{position:absolute;left:0;right:0;top:650px;margin:0;text-align:center;font:600 50px/1.25 var(--font);color:var(--navy)}
.intro-uni{position:absolute;left:0;right:0;top:742px;margin:0;text-align:center;font:400 26px/1.5 var(--font);color:var(--text)}

/* ── CHAPTER CARD ── */
.chap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:120px}
.chap .num{margin:0;font:700 210px/1 var(--font)}
.chap h2{margin:18px 0 0;font:700 88px/1.15 var(--font);color:var(--navy)}
.chap p.s{margin:16px 0 0;font:400 34px/1.4 var(--font);color:var(--teal2);letter-spacing:.06em}
.chap .bar{width:460px;height:3px;margin-top:40px;border-radius:2px;background:linear-gradient(90deg,rgba(34,184,207,0),var(--teal),var(--mint),rgba(52,211,153,0));transform:scaleX(0)}

/* ── TOC ── */
.toc-head{position:absolute;left:150px;top:260px;width:620px}
.toc-head .num{margin:0;font:700 180px/1 var(--font)}
.toc-head h2{margin:12px 0 0;font:700 72px/1.15 var(--font);color:var(--navy)}
.toc-head p{margin:14px 0 0;font:400 30px/1.4 var(--font);color:var(--teal2)}
.toc-list{position:absolute;left:840px;top:136px;width:960px;display:flex;flex-direction:column;gap:10px}
.toc-i{display:flex;align-items:center;gap:20px;padding:10px 20px;border-radius:18px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 8px 22px rgba(15,42,107,.06)}
.toc-i b{flex:none;width:76px;height:46px;border-radius:13px;display:grid;place-items:center;font:700 25px/1 var(--font);color:#fff;background:linear-gradient(135deg,var(--teal),var(--mint))}
.toc-i span{font:500 29px/1.3 var(--font);color:var(--ink)}
.toc-i.sub{padding-left:116px;background:rgba(234,246,251,.9)}
.toc-i.sub span{font:400 23px/1.35 var(--font);color:var(--text)}
.toc-foot{position:absolute;left:840px;top:766px;width:960px;margin:0;font:400 22px/1.5 var(--font);color:var(--mute)}

/* ── รายการเนื้อหา (ล็อก) ── */
.pts{display:flex;flex-direction:column;gap:20px}
.pt{display:flex;gap:20px;align-items:flex-start}
.pt .n{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 24px/1 var(--font);color:#fff;background:linear-gradient(135deg,var(--teal),var(--mint))}
.pt .t{font:400 31px/1.48 var(--font);color:var(--ink)}
.head{position:absolute;left:120px;top:112px;width:1680px}

/* ── PROBLEM ── */
#probPts{position:absolute;left:120px;top:300px;width:900px}
.chan{position:absolute;width:560px;padding:24px 30px;display:flex;align-items:center;gap:22px}
.chan .ico{flex:none;width:76px;height:76px;border-radius:20px;display:grid;place-items:center;font-size:40px;background:var(--sky)}
.chan b{display:block;font:600 34px/1.25 var(--font);color:var(--navy)}
.chan span{display:block;margin-top:4px;font:400 24px/1.35 var(--font);color:var(--mute)}
.chan .x{position:absolute;right:26px;top:50%;margin-top:-28px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  font:700 34px/1 var(--font);color:#fff;background:var(--rose);box-shadow:0 10px 24px rgba(225,29,72,.3)}
#ch0{left:1180px;top:250px}#ch1{left:1240px;top:430px}#ch2{left:1180px;top:610px}
.result{position:absolute;left:120px;top:690px;width:1000px;padding:24px 30px;display:flex;gap:20px;align-items:center;border-radius:24px;
  background:#FFF1F3;border:2px solid #FBC4CF;box-shadow:0 18px 40px rgba(225,29,72,.10)}
.result i{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:700 38px/1 var(--font);font-style:normal;color:#fff;background:var(--rose)}
.result span{font:500 30px/1.4 var(--font);color:#7A1430}

/* ── SOLUTION ── */
#solPts{position:absolute;left:120px;top:290px;width:1000px}
#solPts .t{font-size:28px}

/* ── โทรศัพท์จำลอง: จำลองคอมโพเนนต์จริงของแอป (Navbar, BottomNav, Feed/PostCard, PostDetail, CreatePostModal,
      ClaimButton, SharePost, ModalPortal) · ข้อความทุกคำมาจาก i18n จริง · ขนาดตัวอักษรตามคลาส Tailwind ของจริง ── */
.phone{position:absolute;width:432px;height:934px;border-radius:66px;padding:16px;background:linear-gradient(145deg,#26304A,#0B1124);box-shadow:0 0 0 2px #38425C,0 50px 110px rgba(15,42,107,.28);transform-origin:50% 50%}
.phone .screen{position:relative;width:400px;height:902px;border-radius:52px;overflow:hidden;background:#F5FAFD}
.phone svg.ic{width:1em;height:1em}
.status{position:relative;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:600 15px/1 var(--font);color:#16264D;background:#FFFFFF;z-index:3}
.status .isl{position:absolute;left:50%;top:8px;width:110px;height:28px;margin-left:-55px;border-radius:15px;background:#0B1124}
.status .sic{display:flex;gap:6px;align-items:center}
/* Navbar จริง: โลโก้ 48px + ชื่อหน้า (ไล่สี teal→mint) + ช่องค้นหา + กระดิ่ง + รูปโปรไฟล์ / ปุ่มเข้าสู่ระบบ */
.abar{position:relative;height:58px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#FFFFFF;border-bottom:1px solid var(--line);z-index:3}
.abar .lg{position:relative;flex:none;width:44px;height:44px}
.abar .ttl{flex:none;white-space:nowrap;font:800 14px/1.2 var(--font);background:linear-gradient(90deg,#22B8CF,#34D399);-webkit-background-clip:text;background-clip:text;color:transparent}
.abar .srch{flex:1;min-width:0;display:flex;justify-content:center}
.abar .srch span{display:flex;align-items:center;gap:5px;width:100%;max-width:104px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font:400 12px/1 var(--font);color:#94A3B8}
.abar .rt{flex:none;display:flex;align-items:center;gap:6px}
.abar .login{display:flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font:500 11px/1 var(--font);color:#334155;background:#fff;white-space:nowrap}
.abar .bell{position:relative;width:34px;height:34px;display:grid;place-items:center;font-size:20px;color:#0F2A6B}
.abar .bell i{position:absolute;right:1px;top:1px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#E11D48;color:#fff;font:700 10px/16px var(--font);text-align:center;font-style:normal}
.abar .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--font);color:#0F2A6B;background:#DCEFFB;border:2px solid #DCEFFB}
.abody{position:absolute;left:0;right:0;top:98px;bottom:62px;overflow:hidden}
.feed{position:absolute;inset:0;padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px}
.feed .hero{text-align:center;padding:2px 0}
.feed .hero b{display:block;font:700 16px/1.35 var(--font);color:var(--navy)}
.feed .hero span{display:block;font:400 13px/1.4 var(--font);color:#64748B}
.feed h1{margin:0;font:700 18px/1.3 var(--font);color:var(--navy)}
.feed h1.c{text-align:center}
.filters{display:flex;gap:8px}
.filters span{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:500 12.5px/1.2 var(--font);color:#475569;white-space:nowrap;overflow:hidden}
.empty{margin-top:30px;text-align:center;font:400 13px/1.6 var(--font);color:#94A3B8;padding:0 18px}
/* PostCard จริง: การ์ดแนวตั้ง รูปสี่เหลี่ยมจัตุรัสเต็มความกว้าง กริด 2 คอลัมน์ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.pc{display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(15,42,107,.06)}
.pc .pim{position:relative;aspect-ratio:1/1;background:#EEF7FC;overflow:hidden}
.pc .pim img{display:block;width:100%;height:100%;object-fit:cover}
.pc .k{position:absolute;left:8px;top:8px;z-index:1;padding:2px 8px;border-radius:999px;font:600 10px/1.5 var(--font);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.k.lost,.bdg.lost{background:#FFE4E6;color:#E11D48}.k.found,.bdg.found{background:#D1FAE5;color:#059669}
.pc .pb{display:flex;flex-direction:column;gap:2px;padding:10px}
.pc .cr{display:flex;align-items:center;justify-content:space-between;gap:4px}
.pc .cr .c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 10px/1.3 var(--font);color:#94A3B8}
.pc .cr .pr{flex:none;padding:2px 6px;border-radius:999px;font:600 9px/1.3 var(--font)}
.pc .tt{font:600 14px/1.35 var(--font);color:#1E293B;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .acc{margin-top:2px;width:fit-content;max-width:100%;padding:2px 6px;border-radius:999px;background:#D1FAE5;color:#059669;font:600 9px/1.3 var(--font);white-space:nowrap}
.pc .rm{padding-top:4px;font:400 11px/1.3 var(--font);color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.new{border-color:#22B8CF;box-shadow:0 0 0 3px rgba(34,184,207,.25)}
/* BottomNav จริง: ไอคอน + ป้าย · แท็บที่เลือกเปลี่ยนสีไอคอน */
.anav{position:absolute;left:0;right:0;bottom:0;height:62px;display:flex;background:#FFFFFF;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(15,42,107,.06);z-index:3}
.anav span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 11px/1 var(--font);color:#94A3B8}
.anav span svg{width:18px;height:18px}
.anav span.on{color:#0F2A6B;font-weight:600}
.anav span.on.n0 svg,.anav span.on.n3 svg{color:#22B8CF}.anav span.on.n1 svg{color:#E11D48}.anav span.on.n2 svg{color:#34D399}
.fab{position:absolute;right:16px;bottom:80px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff;
  background:linear-gradient(135deg,var(--navy),var(--teal));box-shadow:0 10px 24px rgba(15,42,107,.3);z-index:4}
/* PostDetail จริง: รูป 4:3 → ผู้แจ้ง (+ปุ่มแชร์) → ป้าย/ชื่อ/InfoCell 2×2 → รายละเอียด → คำร้อง/ปุ่มยืนยันเจ้าของ → จัดการโพสต์ */
.detail{position:absolute;inset:0;overflow:hidden}
.dsc{position:relative;padding:12px 12px 24px;display:flex;flex-direction:column;gap:10px}
.dcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(15,42,107,.05)}
.dcard .st{margin:0 0 8px;font:700 13px/1.3 var(--font);color:var(--navy)}
.dphoto{padding:0;overflow:hidden}
.dphoto .ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;padding:8px;background:#fff}
.dphoto img{display:block;max-width:100%;max-height:100%;border-radius:10px}
.drep .row{display:flex;align-items:center;gap:10px}
.drep .ava{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 14px/1 var(--font);color:#0F2A6B;background:#DCEFFB}
.drep .who{flex:1;min-width:0}
.drep .who b{display:block;font:600 14px/1.3 var(--font);color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drep .who small{display:block;font:400 11px/1.3 var(--font);color:#94A3B8}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font:500 12px/1.2 var(--font);color:var(--navy);background:#fff;white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bdg{padding:4px 10px;border-radius:999px;font:600 11px/1.3 var(--font)}
.bdg.open{background:#EEF7FC;color:#0F2A6B}.bdg.ret{background:#D1FAE5;color:#059669}.bdg.acc{background:#D1FAE5;color:#059669}
.dtt{margin:0;font:700 19px/1.4 var(--font);color:#1E293B}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.info .cell{border-radius:12px;background:#F3F8FC;padding:8px 10px}
.info .cell small{display:block;font:400 10.5px/1.3 var(--font);color:#94A3B8}
.info .cell b{display:block;margin-top:2px;font:600 13px/1.35 var(--font);color:#334155}
.ddesc p{margin:0;font:400 14px/1.6 var(--font);color:#475569}
.cbtn{display:flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 16px;font:600 14px/1.2 var(--font);color:#fff;background:linear-gradient(90deg,var(--navy),var(--teal));box-shadow:0 1px 2px rgba(15,42,107,.15)}
.cli{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(238,247,252,.5)}

.rdy b{font:600 36px/1.3 var(--font);color:var(--navy)}
.rdy span{display:block;font:400 23px/1.4 var(--font);color:var(--mute)}
.stamp{position:absolute;left:1240px;top:430px;width:520px;padding:26px 30px;border:7px solid var(--mint2);border-radius:26px;color:var(--green);text-align:center;
  font:700 48px/1.2 var(--font);transform:rotate(-8deg);background:rgba(255,255,255,.8);opacity:0}

/* ── Q&A ── */
.qmark{position:absolute;left:1360px;top:40px;font:700 920px/1 var(--font);color:rgba(34,184,207,.08);pointer-events:none}
.qa-lead{position:absolute;left:0;right:0;top:260px;margin:0;text-align:center;font:700 64px/1.3 var(--font);color:var(--teal2);opacity:0}
#qaMain{position:absolute;inset:0;pointer-events:none}
.qa-q{position:absolute;left:220px;width:1480px;top:190px;margin:0;text-align:center;font:700 66px/1.3 var(--font);color:var(--navy);text-wrap:balance}
.qa-opts{position:absolute;left:310px;width:1300px;top:420px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.qa-o{display:flex;align-items:center;gap:18px;padding:20px 26px;border-radius:999px;opacity:0}
.qa-o i{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 26px/1 var(--font);font-style:normal;color:#fff;background:linear-gradient(135deg,var(--teal),var(--mint))}
.qa-o span{font:500 27px/1.35 var(--font);color:var(--ink)}
#qaUI{position:absolute;left:300px;right:300px;top:650px;display:none;flex-direction:column;align-items:center;gap:20px;z-index:20}
#qaUI.on{display:flex}
.qa-chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.qa-chips button{padding:14px 26px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);font:500 25px/1.2 var(--font);cursor:pointer;box-shadow:0 6px 16px rgba(15,42,107,.06)}
.qa-form{display:flex;gap:14px;width:100%}
.qa-form input{flex:1;height:76px;border-radius:18px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:0 26px;font:400 29px/1 var(--font)}
.qa-form input:focus{outline:3px solid var(--teal);outline-offset:2px}
.qa-add{height:76px;padding:0 34px;border-radius:18px;border:1.5px solid var(--teal);background:#fff;color:var(--navy);font:700 27px/1 var(--font);cursor:pointer}
.qa-go{height:76px;padding:0 34px;border-radius:18px;border:0;background:var(--navy);color:#fff;font:700 27px/1 var(--font);cursor:pointer}
.qa-hint{margin:0;font:400 21px/1.4 var(--font);color:var(--mute)}
.qa-pause{position:absolute;left:0;right:0;top:760px;margin:0;text-align:center;font:500 25px/1.3 var(--font);color:var(--mute);opacity:0}
#qaUI.on ~ .qa-pause,html.render .qa-pause,html.present .qa-pause{display:none!important}
#wall{position:absolute;inset:0;pointer-events:none;z-index:15}
.op{position:absolute;width:max-content;max-width:540px;padding:16px 24px;border-radius:22px;font:500 25px/1.4 var(--font);color:var(--ink);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}

/* ── END ── */
#endLogo{left:810px;top:70px;width:300px;height:300px}
.end-line{position:absolute;left:660px;top:388px;width:600px;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(34,184,207,0),var(--teal),var(--mint),rgba(52,211,153,0));transform:scaleX(0)}
.end-pre{position:absolute;left:0;right:0;top:420px;margin:0;text-align:center;font:500 24px/1 var(--font);color:var(--teal2);opacity:0}
.end-names{position:absolute;left:150px;right:150px;top:466px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px 18px}
.end-names .nm{display:flex;flex-direction:column;align-items:center;padding:12px 22px;border-radius:20px;background:rgba(255,255,255,.9);border:1px solid var(--line);opacity:0}
.end-names .nm b{font:600 27px/1.3 var(--font);color:var(--navy)}
.end-names .nm span{font:400 19px/1.3 var(--font);color:var(--mute);font-variant-numeric:tabular-nums}
.end-role{position:absolute;left:0;right:0;top:668px;margin:0;text-align:center;font:500 25px/1.45 var(--font);color:var(--text);opacity:0}
.end-adv{position:absolute;left:0;right:0;top:738px;margin:0;text-align:center;font:500 25px/1.3 var(--font);color:var(--navy);opacity:0}
.end-thx{position:absolute;left:0;right:0;top:784px;margin:0;text-align:center;font:700 52px/1.3 var(--font);opacity:0}

/* ── UI นอกเวที ── */
#start{position:fixed;inset:0;z-index:60;display:flex;padding:24px 16px;background:rgba(240,248,252,.94);overflow:auto}
#start[hidden]{display:none}
.start-card{margin:auto;width:min(720px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.start-card .logo{position:relative;width:132px;height:132px}
.start-card h1{margin:4px 0 0;font:700 clamp(30px,5vw,46px)/1.2 var(--font);color:var(--navy);text-wrap:balance}
.start-card p{margin:0;font:400 clamp(15px,2.2vw,19px)/1.55 var(--font);color:var(--text);text-wrap:balance}
.pick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:4px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{min-height:44px;padding:0 18px;border:0;background:transparent;color:var(--text);font:500 16px/1 var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.start-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{min-height:52px;padding:0 26px;border-radius:999px;border:1.5px solid var(--teal);background:#fff;color:var(--navy);font:600 17px/1 var(--font);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn.primary{background:linear-gradient(95deg,var(--navy),var(--teal));border-color:transparent;color:#fff;min-width:240px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:disabled{opacity:.55;cursor:progress}
.btn:focus-visible,#bar button:focus-visible,#track:focus-visible,.seg button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.dl-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.start-card small{font:400 14px/1.45 var(--font);color:var(--mute)}
.start-card p.hint{font-size:14px;color:var(--mute)}
.start-card p.rotate{display:none}
@media (orientation:portrait) and (max-width:820px){.start-card p.rotate{display:block}}
@media (max-height:560px){.start-card{gap:8px}.start-card .logo{width:80px;height:80px}.start-card h1{font-size:24px}.btn{min-height:44px}}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:min(1120px,calc(100% - 32px));display:flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 12px 34px rgba(15,42,107,.16);transition:opacity .35s}
#bar.idle{opacity:0;pointer-events:none}
#bar[hidden]{display:none}
#bar button{width:40px;height:40px;flex:none;border-radius:10px;border:0;background:transparent;color:var(--navy);display:grid;place-items:center;cursor:pointer;font:600 13px/1 var(--font)}
#bar button[hidden]{display:none}
#bar button:hover{background:var(--sky)}
#bar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar button[aria-pressed="false"]{color:var(--mute);opacity:.6}
#track{position:relative;flex:1;min-width:60px;height:28px;cursor:pointer;display:flex;align-items:center;touch-action:none}
#track .rail{position:absolute;left:0;right:0;height:5px;border-radius:3px;background:rgba(15,42,107,.12)}
#track .fill{position:absolute;left:0;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--mint));width:0}
#track .tk{position:absolute;top:8px;width:2px;height:12px;background:rgba(15,42,107,.3);border-radius:1px}
#time{font:500 13px/1 var(--mono);color:var(--mute);white-space:nowrap;min-width:86px;text-align:center}
#dlMenu{position:fixed;z-index:55;right:16px;bottom:80px;display:none;flex-direction:column;gap:6px;padding:10px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 16px 40px rgba(15,42,107,.2)}
#dlMenu.on{display:flex}
#dlMenu a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:var(--navy);text-decoration:none;font:500 15px/1.2 var(--font)}
#dlMenu a:hover{background:var(--sky)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);padding:12px 20px;border-radius:12px;background:var(--navy);color:#fff;font:500 15px/1.4 var(--font);box-shadow:0 10px 30px rgba(11,31,82,.25);opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
@media (max-width:700px){#time{display:none} #bar{gap:2px;padding:6px 8px} #bar button{width:34px;height:34px}}
@media (max-width:460px){#bar #bPrev,#bar #bNext{display:none} #bar button{width:32px;height:32px} #track{min-width:40px}}
@media (prefers-reduced-motion:reduce){#bar,#toast{transition:none}}

/* ไอคอน SVG แทนอีโมจิในฉากเนื้อหา */
svg.bi{width:1em;height:1em;flex:none;display:block}
.tool .ic{color:var(--teal2)}
.chan .ico svg{width:38px;height:38px}
#aRules b svg{color:var(--mint2);vertical-align:-4px}
.gm-ph{display:block;width:96px;height:96px;margin:6px auto;border-radius:10px;overflow:hidden;border:1px solid #DCEFFB}
.gm-ph img{display:block;width:100%;height:100%;object-fit:cover}
/* โหมดนำเสนอเอง / โหมดเรนเดอร์ */
html.present .film-only{display:none!important}
html.render #bar,html.render #dlMenu,html.render #toast,html.render #start{display:none!important}
#bar #bVoice{width:auto;min-width:40px;padding:0 8px;font-size:12px}
#bar #bLang{font-size:12px}
.start-card .dl-block{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}
.credits{font:400 11px/1.5 var(--font);color:var(--mute);text-align:center;max-width:620px}
.credits a{color:var(--teal2)}

/* ปรับหลังตรวจภาพ: ด่านตรวจบรรทัดเดียว · หน้าต่างโค้ดไม่ทับกล่อง · แกนวงโคจรตัวอักษรอยู่ในวงกลม */
.gchip{padding:10px 12px;font-size:18px;gap:8px;white-space:nowrap}
.gchip .ic{font-size:22px}
.codew{top:606px}
.core{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px}
.core .ic{font-size:76px}
.core b{font-size:24px;line-height:1.25;max-width:220px}
.core b{white-space:pre-line}
.gchip{font-size:17px}
</style>

</div>
<div id="bar" hidden>
  <button type="button" id="bPrev"><svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16z"/><path d="M5 19V5"/></svg></button>

</div>

/* ───────────── เสียง ───────────── */
const AU = { ctx: null, active: new Set(), buffers: {}, muted: false, live: false }
function clockNow() { return AU.live ? AU.ctx.currentTime : performance.now() / 1000 }
function makeGraph(ctx) {
  const g = {}
  g.master = ctx.createGain(); g.master.gain.value = AU.muted ? 0 : 0.95
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.25
  g.an = ctx.createAnalyser(); g.an.fftSize = 2048
  g.master.connect(comp); comp.connect(g.an); g.an.connect(ctx.destination)
  g.voice = ctx.createGain(); g.voice.gain.value = 1.0; g.voice.connect(g.master)
  g.music = ctx.createGain(); g.music.gain.value = PRESENT ? 0.0 : 0.26; g.duck = ctx.createGain(); g.duck.gain.value = 1; g.music.connect(g.duck); g.duck.connect(g.master)
  g.sfx = ctx.createGain(); g.sfx.gain.value = PRESENT ? 0.4 : 0.55; g.sfx.connect(g.master)
  const len = Math.floor(ctx.sampleRate * 3.0); const ir = ctx.createBuffer(2, len, ctx.sampleRate); let s = 7
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) { s = (s * 16807) % 2147483647; d[i] = ((s / 2147483647) * 2 - 1) * Math.pow(1 - i / len, 2.6) } }
  g.rev = ctx.createConvolver(); g.rev.buffer = ir; g.revIn = ctx.createGain(); g.revIn.gain.value = 0.3; g.revIn.connect(g.rev)
  const rg = ctx.createGain(); rg.gain.value = 0.5; g.rev.connect(rg); rg.connect(g.master)
  const nl = Math.floor(ctx.sampleRate * 2.5); g.noise = ctx.createBuffer(1, nl, ctx.sampleRate); const nd = g.noise.getChannelData(0); let q = 99
  for (let i = 0; i < nl; i++) { q = (q * 16807) % 2147483647; nd[i] = (q / 2147483647) * 2 - 1 }
  return g
}
function initAudio() {
  if (AU.ctx) return AU.ctx
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback' } catch {}
  const AC = window.AudioContext || window.webkitAudioContext
  if (!AC) return null
  let ctx
  try { ctx = new AC({ latencyHint: 'playback' }) } catch { try { ctx = new AC() } catch { return null } }
  try { const b = ctx.createBuffer(1, 1, ctx.sampleRate); const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0) } catch {}
  Object.assign(AU, makeGraph(ctx), { ctx })
  // มือถือบางรุ่นเปิดระบบเสียงช้ากว่าที่รอไว้ — พร้อมเมื่อไรต่อเสียงเข้ากับภาพที่กำลังเล่นทันที ไม่ต้องรอผู้ใช้แตะซ้ำ
  ctx.onstatechange = () => { if (ctx.state === 'running' && playing && !AU.live) play(curTime()) }
  return ctx
}
function b64buf(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer }
function decodeOne(ctx, ab) { return new Promise((res) => { try { const p = ctx.decodeAudioData(ab, res, () => res(null)); if (p && p.then) p.then(res, () => res(null)) } catch { res(null) } }) }
function decoderCtx() {
  if (AU.ctx) return AU.ctx
  if (!AU.dec) { const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; try { AU.dec = OAC ? new OAC(1, 1, 48000) : null } catch { AU.dec = null } }
  return AU.dec
}
const VOICE_JSON = {}
function voiceData(key) {
  if (key in VOICE_JSON) return VOICE_JSON[key]
  const el = document.getElementById(`voice-${key}`)
  try { VOICE_JSON[key] = el ? JSON.parse(el.textContent) : null } catch { VOICE_JSON[key] = null }
  return VOICE_JSON[key]
}
async function decodeKey(key) {
  if (PRESENT) return
  const ctx = decoderCtx(), vd = voiceData(key); if (!ctx || !vd) return
  AU.buffers[key] = AU.buffers[key] || {}
  await Promise.all(DATA.lines.map(async (l) => {
    if (AU.buffers[key][l.id] || !vd[l.id]) return
    AU.buffers[key][l.id] = await decodeOne(ctx, b64buf(vd[l.id]))
  }))
}
const track = (...n) => n.forEach((x) => { AU.active.add(x); x.onended = () => AU.active.delete(x) })
function stopAll() {
  for (const n of AU.active) { try { n.onended = null; n.stop() } catch {} try { n.disconnect() } catch {} }
  AU.active.clear()
  if (AU.ctx && AU.duck) { const t = AU.ctx.currentTime; AU.duck.gain.cancelScheduledValues(t); AU.duck.gain.setValueAtTime(1, t) }
}
function level() {
  if (!AU.an || !AU.ctx) return 0
  const n = AU.an.fftSize, buf = new Float32Array(n)
  if (AU.an.getFloatTimeDomainData) AU.an.getFloatTimeDomainData(buf)
  else { const b = new Uint8Array(n); AU.an.getByteTimeDomainData(b); for (let i = 0; i < n; i++) buf[i] = (b[i] - 128) / 128 }

function env(g, w, peak, a, d) { g.gain.setValueAtTime(0.0001, w); g.gain.exponentialRampToValueAtTime(peak, w + a); g.gain.exponentialRampToValueAtTime(0.0001, w + a + d) }

  },

function demoPlan(dur) {
  const T = A[LANG], cps = { title: 30, desc: 34, spot: 22, msg: 30 }

  P.d1 = { lead: 0.8, need: Math.max(dur.d1 + 0.6, 3.4) }
  const tap2 = Math.max(2.6, dur.d2 * 0.8)
  P.d2 = { lead: 0.4, need: tap2 + 0.8, tap: tap2 }
  const tap3 = Math.max(3.0, dur.d3 * 0.9)
  P.d3 = { lead: 2.3, need: tap3 + 0.7, tap: tap3 }
  const allow4 = Math.max(3.9, dur.d4 * 0.92)
  P.d4 = { lead: 0.9, need: allow4 + 0.7, allow: allow4 }
  // กดเมนู "ของฉัน" → ปุ่ม + (อยู่ในหน้านี้ในแอปจริง) → ฟอร์ม → เลือก "พบของ" → พิมพ์ชื่อ/รายละเอียด
  const tTitle = 1.8, titleEnd = tTitle + 0.15 + T.vTitle.length / cps.title, tDesc = titleEnd + 0.2, descEnd = tDesc + 0.15 + T.vDesc.length / cps.desc
  P.d5 = { lead: 1.7, need: descEnd + 0.25, tTitle, tDesc, cpsTitle: cps.title, cpsDesc: cps.desc }
  // หมวด/ความสำคัญ/ห้อง/จุดสังเกต (ก่อนเสียง) → แนบรูป → โพสต์ → หน้ารายละเอียด → กลับหน้าแรก เห็นโพสต์ขึ้นฟีด

function curTime() { return playing ? Math.min(total, startPos + Math.max(0, clockNow() - startClock)) : pos }

}
function scheduleFrom(from) {

    if (e.len && e.t + e.len > from && (e.type === 'voice' || e.type === 'chord')) startEvent(e, startClock, from - e.t)

}

const PARTS = Array.from({ length: 100 }, (_, i) => ({ x: rnd(i + 1) * 1920, y: rnd(i + 101) * 1080, vx: (rnd(i + 201) - 0.5) * 10, vy: -(5 + rnd(i + 301) * 16), s: 0.9 + rnd(i + 401) * 2.6, ph: rnd(i + 501) * 6.28, w: 0.4 + rnd(i + 601) * 1.5, a: 0.1 + rnd(i + 701) * 0.35, c: i % 3 }))
const BURST = Array.from({ length: 110 }, (_, i) => ({ ang: rnd(i + 901) * Math.PI * 2, sp: 300 + rnd(i + 1001) * 800, s: 3 + rnd(i + 1101) * 6, c: i % 5, r: rnd(i + 1201) * 6.28 }))
const BCOL = ['34,184,207', '52,211,153', '251,191,36', '251,113,133', '15,42,107']
const DCOL = ['34,184,207', '15,42,107', '52,211,153']
function drawFX(t) {
  if (!fxCtx) return
  const c = fxCtx; c.clearRect(0, 0, 1920, 1080)
  const k = FXS.dust

    const x = (((p.x + p.vx * t + Math.sin(t * 0.3 + p.ph) * 26) % 1920) + 1920) % 1920, y = (((p.y + p.vy * t) % 1080) + 1080) % 1080

    }

}

function setupDownloads() {
  if (!DATA.video) return
  for (const g of ['m', 'f']) $$(`[data-dl="${g}"]`).forEach((a) => { a.href = (DATA.video.base || '') + DATA.video[g]; a.setAttribute('download', DATA.video[g]) })
}

function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%,-50%) scale(${s})` }
addEventListener('resize', fit); fit()

/* main loop — เฟรมพังหนึ่งเฟรมต้องไม่หยุดทั้งเรื่อง: เรียก rAF ก่อนเสมอ แล้วค่อย try/catch */
let frameErr = 0, frameCount = 0
function frame() {
  requestAnimationFrame(frame)
  frameCount++
  try {
    let t = curTime()
    if (playing) {
      if (AU.live) pump(t)
      if (t >= stopAt) { pos = stopAt; playing = false; stopAll(); setPlayIcon(); poke(); t = pos; if (inQA(pos)) openQA(); if (PRESENT && pos >= total - 0.1) toast(STR[LANG].presentEnd) }
      else if (t >= total) { pause(); pos = total; t = total }
    }
    if (tl) tl.time(t, false)
    drawFX(t); updateUI(t)
  } catch (err) { if (frameErr++ < 3) console.warn('[film] frame', err) }
}

/* เสียงทั้งเรื่องแบบออฟไลน์ (ใช้ทำ MP4) */
const CHUNK = 3 * 1024 * 1024
async function renderAudio() {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext
  const sr = 48000, octx = new OAC(2, Math.ceil((total + 0.25) * sr), sr)
  const saved = Object.assign({}, AU)
  Object.assign(AU, makeGraph(octx), { ctx: octx, active: new Set(), live: true })
  AU.master.gain.value = 0.95
  try { for (const e of EV) startEvent(e, e.t, 0) }
  finally { for (const k of Object.keys(AU)) if (!(k in saved)) delete AU[k]; Object.assign(AU, saved) }
  const buf = await octx.startRendering()
  const ch = buf.numberOfChannels, n = buf.length, dv = new DataView(new ArrayBuffer(44 + n * ch * 2))
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)) }
  str(0, 'RIFF'); dv.setUint32(4, 36 + n * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true)
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true); str(36, 'data'); dv.setUint32(40, n * ch * 2, true)
  const data = Array.from({ length: ch }, (_, c) => buf.getChannelData(c)); let o = 44, peak = 0
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, data[c][i])); peak = Math.max(peak, Math.abs(v)); dv.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2 }
  window.__wav = new Uint8Array(dv.buffer)
  return { bytes: window.__wav.length, chunks: Math.ceil(window.__wav.length / CHUNK), peak }
}
function audioChunk(i) {
  const part = window.__wav.subarray(i * CHUNK, (i + 1) * CHUNK); let s = ''
  for (let j = 0; j < part.length; j += 0x8000) s += String.fromCharCode.apply(null, part.subarray(j, j + 0x8000))
  return btoa(s)
}

/* boot */
async function boot() {
  updateLangUI(); setupDownloads()
  try { await Promise.race([document.fonts.ready, wait(3000)]) } catch {}
  await decodeKey(VKEY)
  build(); setPlayIcon()
  pos = RENDER ? 0 : 4.2; tl.time(pos, false)
  requestAnimationFrame(frame)
  $('#btnStart').disabled = false
  if (RENDER) $('#start').hidden = true
  bootDone = true
}
async function startFilm() {
  if (started) return
  $('#btnStart').disabled = true
  const ctx = initAudio()
  if (ctx && ctx.state !== 'running') { try { await Promise.race([ctx.resume(), wait(1500)]) } catch {} }
  $('#start').hidden = true; bar.hidden = false; started = true
  keepAwake()
  tl.time(0, false); play(0)
}
function keepAwake() {
  try {
    const pol = document.permissionsPolicy || document.featurePolicy
    if (!navigator.wakeLock || (pol && pol.allowsFeature && !pol.allowsFeature('screen-wake-lock'))) return
    navigator.wakeLock.request('screen').catch(() => {})
  } catch {}
}
const pickChange = async (lang, g) => { LANG = lang; GENDER = g; VKEY = `${LANG}-${GENDER}`; save(); updateLangUI(); await decodeKey(VKEY); build(); pos = 4.2; tl.time(pos, false) }
$$('.seg [data-lang]').forEach((b) => { b.onclick = () => { if (b.dataset.lang !== LANG) pickChange(b.dataset.lang, GENDER) } })
$$('.seg [data-g]').forEach((b) => { b.onclick = () => { if (b.dataset.g !== GENDER) pickChange(LANG, b.dataset.g) } })
$('#btnStart').onclick = () => { toggleFull(); startFilm() }
window.__film = {
  get ready() { return bootDone }, get total() { return total }, get T() { return T }, get lang() { return LANG }, get gender() { return GENDER },
  get pausePts() { return pausePts.slice() }, get lineStarts() { return lineStarts.slice() }, get subMax() { return subMax },
  seek(t) { pos = Math.max(0, Math.min(total, t)); if (tl) tl.time(pos, false); drawFX(pos) },
  renderAudio, audioChunk, start: startFilm, nextBeat, prevBeat, toggle, openQA,
  async setVoice(lang, g) { LANG = lang; GENDER = g; VKEY = `${lang}-${g}`; await decodeKey(VKEY); build(); updateLangUI(); return total },
  diag() { return { t: +curTime().toFixed(3), frames: frameCount, playing, started, lang: LANG, gender: GENDER, mode: PRESENT ? 'present' : 'film', live: AU.live, state: AU.ctx ? AU.ctx.state : 'none', voices: PRESENT ? 0 : Object.values(AU.buffers[VKEY] || {}).filter(Boolean).length, lines: DATA.lines.length, nodes: AU.active.size, level: +level().toFixed(4), qa: !!stage.querySelector('#qaUI.on'), total: +total.toFixed(2), cc: ccOn } },
}
boot().catch((err) => {
  console.error('[film] boot failed', err)
  const p = $('#stSub'); if (p) p.textContent = STR[LANG].fail
})
})()
</script>
